name: Update visual baselines

# Manual: re-render the screenshot baselines on Linux after an intended UI change, then
# download the artifact and commit apps/web/e2e/__screenshots__ (or run `pnpm e2e:docker
# --update-snapshots` locally, which renders in the same image).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm e2e --project=visual-desktop --project=visual-mobile --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/web/e2e/__screenshots__
